<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News List Diagnostic</title>
</head>
<body>
  <main>
    <h1>News List Diagnostic</h1>

    <section class="news-list">
      {{#data}}
        {{#articlePaginated}}
          {{#edges}}
            {{#node}}
              <article class="news-card">
                <h2>
                  <a href="/news/{{slug}}">{{title}}</a>
                </h2>
              </article>
            {{/node}}
          {{/edges}}
        {{/articlePaginated}}
      {{/data}}
    </section>
  </main>
</body>
</html>
