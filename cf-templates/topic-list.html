<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topic News List Diagnostic</title>
  <meta name="description" content="Latest news and articles">
  <link rel="canonical" href="/news">
</head>
<body>
  <header></header>

  <main>
    <div>
      <h1>Topic News List Diagnostic</h1>

      <div class="news-list">
        {{#data}}
          {{#articlePaginated}}
            {{#edges}}
              {{#node}}
                <div>
                  <div>
                    <h2>
                      <a href="/news/{{slug}}">{{title}}</a>
                    </h2>
                  </div>
                </div>
              {{/node}}
            {{/edges}}
          {{/articlePaginated}}
        {{/data}}
      </div>
    </div>
  </main>

  <footer></footer>
</body>
</html>
